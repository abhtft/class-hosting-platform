# Auto-deploy on every push to main, for a project whose app sits at the top of the repo (a normal Vite or React project)
# with an optional backend/ folder beside it.
#
# 1. Save this file as .github/workflows/deploy.yml in your repo, and portal-deploy.mjs in the repo root.
# 2. GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret:
#      PORTAL_TOKEN = the token you sign in to the portal with (starts with mds_)
#    The token is a secret: never put it in a file you commit. It stops working when it expires; then you request
#    regeneration on the portal and update this secret.
# 3. Make sure .gitignore contains dist and node_modules: the build runs here, on GitHub.
#
# Your backend's own environment variables (API keys) are set once on the portal (Backend card); they stay in place
# across deploys, so they do not belong here.
name: Deploy to class hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No package-lock.json in your repo? Change `npm ci` to `npm install`.
      - run: npm ci
      - run: node portal-deploy.mjs --frontend .
        env:
          PORTAL_TOKEN: ${{ secrets.PORTAL_TOKEN }}
