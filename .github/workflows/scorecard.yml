name: Scorecard

# OpenSSF Scorecard: a public score for the repository's security practices (branch protection, pinned dependencies, a security policy, signed releases).
# Results appear under Security > Code scanning, and the score is published at https://scorecard.dev.
on:
  branch_protection_rule:
  schedule:
    - cron: '41 4 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload the results to code scanning
      id-token: write          # publish the score
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
