name: Release

# Publishing a release = pushing a tag such as v1.2.0 (the tag must equal the VERSION file). This workflow runs the whole suite, builds the teacher
# package from exactly that commit, and attaches the files to a GitHub Release:
#
#   class-platform-teacher-<version>.tgz   the pinned package (what upgrade commands and editor entries use)
#   class-platform-teacher.tgz             the same file without the version in its name, for the "latest" link on the README
#   sha256sums.txt                         checksums
#
# A teacher then needs only:  npx -y https://github.com/abhtft/class-hosting-platform/releases/latest/download/class-platform-teacher.tgz install
# If the repository has an NPM_TOKEN secret the package is also published to the npm registry, with provenance.
on:
  push:
    tags: ['v*']

# Nothing is writable by default; the one job below asks for what it needs
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # create the release
      id-token: write      # build provenance and npm provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install boto3 cfn-lint
      - name: The tag must match the VERSION file
        run: |
          test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < VERSION)" || { echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }
      - name: Template lint
        run: cfn-lint -i W1030 -t template.yaml
      - name: Local test suite
        run: node tests/run.mjs
      - name: Build the package and the release files
        run: node build-teacher-package.mjs --repo "${GITHUB_REPOSITORY}" --pack --release dist/release
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*.tgz
      - name: Release notes from the changelog
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          awk -v v="$v" '$0 ~ "^## " v "$" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/release/* --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
      - name: Publish to npm (only if an NPM_TOKEN secret exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then (cd dist/teacher-package && npm publish --provenance --access public); else echo "No NPM_TOKEN: skipping the npm registry."; fi

  # Signs the release files AFTER the release exists, so a signing problem can never stop a release. Keyless (Sigstore): the signature is tied to this
  # workflow's identity and recorded in a public log; nobody holds a signing key. Verify with the command in SECURITY.md.
  sign:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # attach the signature files to the release
      id-token: write      # the keyless signing identity
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release --pattern '*.tgz' --pattern 'sha256sums.txt'
      - name: Sign each file (one .sigstore.json bundle per file)
        run: |
          cd release
          for f in sha256sums.txt *.tgz; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; done
          ls -l
      - name: Attach the signatures to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release/*.sigstore.json --repo "${GITHUB_REPOSITORY}"
