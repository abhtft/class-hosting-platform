# Weekly pull requests that update dependencies and the versions of the GitHub Actions the workflows use.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /starter/template/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      student-frontend:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /starter/template
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /starter/mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /teacher-mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
